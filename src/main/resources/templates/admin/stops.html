<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Stops')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Transit Stops Directory</h1>
            <p class="page-subtitle">Geocoded waypoints with latitude and longitude for GPS distance calculations and ETA predictions.</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
            <a th:href="@{/admin/routes}" class="btn btn-secondary">&larr; Routes</a>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div style="display: grid; grid-template-columns: 350px 1fr; gap: 1.5rem;">
        <!-- Add Stop Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">+ Add Transit Stop</h3>
            </div>
            <form th:action="@{/admin/stops/save}" th:object="${newStop}" method="post">
                <div class="form-group">
                    <label class="form-label">Stop Name *</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Navalur Toll Plaza" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Latitude *</label>
                    <input type="number" step="0.000001" class="form-control" th:field="*{latitude}" placeholder="12.8456" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Longitude *</label>
                    <input type="number" step="0.000001" class="form-control" th:field="*{longitude}" placeholder="80.2268" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description / Landmark</label>
                    <textarea class="form-control" th:field="*{description}" rows="2" placeholder="Near AGS Cinemas & OMR Food Street"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Stop Waypoint</button>
            </form>
        </div>

        <!-- Stops Table -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Registered Stops (<span th:text="${stops.size()}">12</span>)</h3>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Stop Name</th>
                            <th>Coordinates</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${stops}">
                            <td><strong th:text="${s.name}">Central Station</strong></td>
                            <td>
                                <code><span th:text="${s.latitude}">13.0827</span>, <span th:text="${s.longitude}">80.2707</span></code>
                            </td>
                            <td th:text="${s.description}">Description</td>
                            <td>
                                <form th:action="@{'/admin/stops/delete/' + ${s.id}}" method="post" onsubmit="return confirm('Are you sure you want to delete this stop?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
