<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width: 600px; text-align: center; margin-top: 4rem;">
    <div class="card" style="padding: 3rem 2rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🚫</div>
        <h1 style="font-size: 2rem; color: var(--secondary); margin-bottom: 0.5rem;">403 - Access Denied</h1>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;" th:text="${message}">
            You do not have permission to access this administrative or protected transit resource.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a th:href="@{/track}" class="btn btn-primary">Return to Passenger Map</a>
            <a th:href="@{/login}" class="btn btn-secondary">Switch User / Login</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
