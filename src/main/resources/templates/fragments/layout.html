<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Real-Time Bus Tracking System'">Real-Time Bus Tracking System</title>
    
    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Leaflet CSS for Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- SockJS and STOMP for WebSocket Live Telemetry -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- Map Integration Script -->
    <script th:src="@{/js/tracking-map.js}"></script>
</head>
<body>

<footer th:fragment="footer" class="footer">
    <div style="max-width: 1200px; margin: 0 auto;">
        <p><strong>Real-Time Bus Tracking System</strong> — Course Level Project-Based Learning</p>
        <p style="margin-top: 0.25rem; font-size: 0.8rem;">
            Department of Computer Science and Engineering | Sathyabama Institute of Science and Technology
        </p>
        <p style="margin-top: 0.25rem; font-size: 0.75rem; color: #64748b;">
            Built 100% with Java, Spring Boot, Spring Security, Spring Data JPA, Thymeleaf, WebSocket STOMP, and OpenStreetMap.
        </p>
    </div>
</footer>

</body>
</html>
