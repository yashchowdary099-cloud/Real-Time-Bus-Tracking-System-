# ==============================================================================
# REAL-TIME BUS TRACKING SYSTEM - APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=Real-Time Bus Tracking System
server.port=${SERVER_PORT:8080}

# Default Active Profile: mysql (or set SPRING_PROFILES_ACTIVE=h2 for standalone zero-config mode)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Web & Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# WebSocket / STOMP Configuration
app.websocket.endpoint=/ws-bus-tracking
app.websocket.topic-prefix=/topic
app.websocket.app-prefix=/app

# GPS Simulation Defaults
app.simulation.auto-start=true
app.simulation.interval-ms=2000
app.simulation.speed-multiplier=1.0

# Logging
logging.level.com.bustracking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
